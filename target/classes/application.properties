spring.application.name=flexolx-api
server.port=8080

# Mensagens de erro padrao do Spring (400/404/etc.) em JSON, sem stacktrace exposto
server.error.include-message=always
server.error.include-binding-errors=always

# Fuso horario de Joao Pessoa, usado nas datas de propostas/anuncios
spring.jackson.time-zone=America/Recife
